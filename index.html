<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>손가락 운동회</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Gothic:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>if(!window.Peer)document.write('<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"><\/script>')</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--field:#2F7A4A;--field2:#2A7043;--ink:#1B2430;--blue:#1E56C4;--blue-soft:#9CC0FF;--red:#D62839;--yellow:#F4B400}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Nanum Gothic','Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-weight:800;color:#fff;overflow-x:hidden;
  background:var(--field) repeating-linear-gradient(90deg,var(--field) 0 140px,var(--field2) 140px 280px)}
.display{font-family:'Black Han Sans','Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-weight:400}
button,input,textarea{font:inherit}
.hidden{display:none!important}
.btn{font-size:clamp(18px,1.8vw,32px);padding:.5em 1.05em;border-radius:16px;border:0;background:#fff;color:var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.3);cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.btn.go{background:var(--yellow)}.btn.red{background:var(--red);color:#fff}
.btn.small{font-size:clamp(15px,1.3vw,22px)}.btn.big{font-size:clamp(24px,2.5vw,46px)}
.btn:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:4px solid var(--yellow);outline-offset:3px}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;margin-top:16px}
.warn{background:var(--yellow);color:var(--ink);border-radius:14px;padding:12px 18px;margin:12px auto 0;max-width:1000px;font-size:clamp(16px,1.4vw,22px);text-align:center;line-height:1.5}

/* ================= 핸드폰 ================= */
html.isphone,html.isphone body{overflow:hidden;overscroll-behavior:none;touch-action:none;position:fixed;inset:0;height:100%}
.isphone .pjoin{touch-action:none}
#phone{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.pjoin{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;gap:20px;padding:24px;text-align:center}
.pjoin h1{font-size:clamp(38px,11vw,64px);margin:0;text-shadow:0 5px 0 rgba(0,0,0,.28)}
.pjoin p{font-size:clamp(22px,6vw,32px);margin:0}
.teambtn{font-family:'Black Han Sans',sans-serif;font-size:clamp(46px,14vw,80px);padding:.35em;border-radius:28px;border:8px solid #fff;background:var(--bg);color:var(--fg);box-shadow:0 10px 0 rgba(0,0,0,.3);cursor:pointer}
.teambtn.w{border-color:var(--ink)}
.ptop{text-align:center;width:100%}
.pwho{font-size:clamp(30px,9vw,54px)}
.pstatus{font-size:clamp(26px,7.5vw,48px);min-height:2.6em;margin-top:6px;line-height:1.25;display:flex;align-items:center;justify-content:center}
.tap{width:min(80vw,58vh);aspect-ratio:1;border-radius:50%;border:12px solid #fff;background:var(--bg);color:var(--fg);
  font-family:'Black Han Sans',sans-serif;font-size:clamp(50px,15vw,100px);display:grid;place-items:center;box-shadow:0 14px 0 rgba(0,0,0,.3);touch-action:manipulation;cursor:pointer}
.tap.w{border-color:var(--ink)}
.tap.hit{transform:scale(.93)}
.tap.off{opacity:.35}
.flags{display:flex;flex-direction:column;gap:18px;width:100%;max-width:520px}
.fbtn{height:min(26vh,210px);border-radius:28px;font-family:'Black Han Sans',sans-serif;font-size:clamp(50px,15vw,90px);border:10px solid #fff;box-shadow:0 10px 0 rgba(0,0,0,.3);cursor:pointer;touch-action:manipulation}
.fbtn.b{background:var(--blue);color:#fff}.fbtn.wf{background:#fff;color:var(--ink);border-color:var(--ink)}
.fbtn.off{opacity:.35}.fbtn.hit{transform:scale(.95)}
.pcount{font-size:clamp(26px,7.5vw,46px)}
.plink{background:transparent;border:0;color:#fff;opacity:.6;font-size:16px;text-decoration:underline;cursor:pointer;margin-top:6px}

/* ================= TV ================= */
.bunting{height:52px;pointer-events:none}.bunting svg{width:100%;height:100%;display:block}
.top{position:relative;text-align:center;padding:0 260px}
.top h1{margin:0;font-size:clamp(30px,3.6vw,64px);line-height:1.1;text-shadow:0 5px 0 rgba(0,0,0,.28)}
.tools{position:absolute;right:24px;top:0;display:flex;gap:10px;align-items:center}
.ghost{background:transparent;color:#fff;border:3px solid rgba(255,255,255,.8);border-radius:14px;padding:.35em .8em;font-size:clamp(14px,1.1vw,20px);cursor:pointer}
.badge{position:absolute;left:24px;top:4px;font-size:clamp(14px,1.1vw,19px);background:rgba(0,0,0,.25);border-radius:12px;padding:6px 12px;text-align:left;line-height:1.4}
.badge b{color:var(--yellow)}
.board{display:flex;gap:18px;padding:12px 28px 0}
.team{flex:1;display:flex;align-items:center;justify-content:space-between;background:var(--bg);color:var(--fg);border:5px solid #fff;border-radius:22px;padding:.15em .8em;cursor:pointer;box-shadow:0 7px 0 rgba(0,0,0,.25)}
.team.w{border-color:var(--ink)}
.tname{font-size:clamp(22px,2.5vw,46px)}.tscore{font-size:clamp(38px,4.8vw,92px);line-height:1}
.bump{animation:bump .6s ease}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.3)}100%{transform:scale(1)}}
.tabs{display:flex;gap:8px;justify-content:center;margin:12px 20px 0;flex-wrap:wrap}
.tabs button{font-size:clamp(15px,1.25vw,22px);padding:.4em .9em;border-radius:999px;border:3px solid #fff;background:transparent;color:#fff;cursor:pointer}
.tabs button.on{background:#fff;color:var(--ink)}
.tabs button:disabled{opacity:.45;cursor:default}
#stage{margin:12px 28px 24px;padding:18px 26px;border:4px solid rgba(255,255,255,.9);border-radius:30px;min-height:calc(100vh - 290px);background:rgba(0,0,0,.13)}
.call{text-align:center;font-size:clamp(50px,6.4vw,128px);line-height:1.1;text-shadow:0 7px 0 rgba(0,0,0,.3)}
.call.mid{font-size:clamp(38px,4.4vw,84px)}
.sub{text-align:center;font-size:clamp(19px,1.9vw,34px);margin-top:4px}
/* 입장 */
.lobby{display:grid;grid-template-columns:auto 1fr;gap:36px;align-items:center}
.qr{background:#fff;padding:18px;border-radius:24px;width:clamp(260px,24vw,440px)}
.qr img,.qr canvas{width:100%!important;height:auto!important;display:block}
.qrurl{color:var(--ink);font-size:14px;word-break:break-all;text-align:center;margin-top:8px;font-weight:700}
.steps{font-size:clamp(24px,2.4vw,44px);line-height:1.6}
.steps b{color:var(--yellow)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{background:var(--bg);color:var(--fg);border:3px solid #fff;border-radius:999px;padding:.15em .7em;font-family:'Black Han Sans',sans-serif;font-size:clamp(18px,1.6vw,28px)}
.chip.w{border-color:var(--ink)}
.chip.cur{outline:5px solid var(--yellow);outline-offset:2px}
.chip.done{opacity:.45}
.cnt2{font-size:clamp(26px,2.6vw,48px);margin-top:14px}
/* 개회식 풍선 */
.bigb{height:44vh;display:grid;place-items:center}
.bal{width:min(36vh,420px);aspect-ratio:.85;border-radius:50% 50% 48% 48%;background:radial-gradient(circle at 35% 30%,#ff8a95,#D62839 60%,#a51628);
  transform:scale(.25);transition:transform .15s;position:relative;box-shadow:inset -18px -18px 0 rgba(0,0,0,.12)}
.bal::after{content:"";position:absolute;left:50%;bottom:-18px;transform:translateX(-50%);border-left:14px solid transparent;border-right:14px solid transparent;border-bottom:22px solid #a51628}
.bal.pop{animation:pop .35s forwards}
@keyframes pop{to{transform:scale(1.6);opacity:0}}
.gauge{width:min(760px,70%);height:40px;border-radius:20px;background:rgba(255,255,255,.2);overflow:hidden;border:4px solid #fff;margin:10px auto}
.gauge i{display:block;height:100%;width:0;background:var(--yellow);transition:width .15s}
.gauge.sm{width:min(300px,24vw);height:30px;border-width:3px}
/* 청기백기 */
.flagres{display:flex;gap:24px;justify-content:center;margin-top:18px}
.fr{background:var(--bg);color:var(--fg);border:5px solid #fff;border-radius:22px;padding:12px 28px;text-align:center;min-width:280px}
.fr.w{border-color:var(--ink)}
.fr .n{font-size:clamp(40px,4.4vw,84px)}
.fr .d{font-size:clamp(17px,1.5vw,26px)}
.answer{font-size:clamp(26px,2.6vw,48px);text-align:center;color:var(--yellow);min-height:1.3em;margin-top:6px}
/* 눈싸움 */
.snow{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:12px;position:relative;border-radius:24px;overflow:hidden;border:4px solid #fff}
.half2{padding:16px;text-align:center;min-height:36vh}
.half2.b{background:rgba(30,86,196,.55)}.half2.w{background:rgba(255,255,255,.28)}
.half2 .n{font-size:clamp(70px,8vw,150px);line-height:1}
.dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.dots span{width:clamp(16px,1.4vw,24px);aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:inset -3px -3px 0 rgba(0,0,0,.15)}
.fly{position:fixed;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:inset -4px -4px 0 rgba(0,0,0,.15);pointer-events:none;z-index:40}
/* 배구 */
#vc{width:100%;height:50vh;display:block;border-radius:22px}
.vs{display:flex;justify-content:center;gap:40px;font-size:clamp(40px,4.4vw,84px);align-items:center}
.vs span{min-width:1.5em;text-align:center}
/* 릴레이 */
.rlane{background:rgba(0,0,0,.18);border-radius:22px;padding:14px 18px;margin-top:14px}
.rlane h3{margin:0;font-size:clamp(24px,2.4vw,44px);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.rlane .now{font-size:.75em;color:var(--yellow)}
/* 박 */
.paks{display:flex;justify-content:center;gap:clamp(30px,8vw,140px);margin-top:4px}
.pakcol{text-align:center}
.pak{position:relative;width:min(240px,18vw);aspect-ratio:1;margin:44px auto 8px}
.pak::before{content:"";position:absolute;left:50%;top:-44px;width:4px;height:44px;background:#fff;transform:translateX(-50%)}
.half{position:absolute;top:0;width:50%;height:100%;background:var(--bg);border:6px solid rgba(0,0,0,.28);background-image:repeating-linear-gradient(0deg,transparent 0 30px,rgba(255,255,255,.35) 30px 38px);transition:transform .7s cubic-bezier(.2,1.4,.4,1)}
.half.l{left:0;border-radius:100% 0 0 100%/50% 0 0 50%;border-right:none;transform-origin:100% 0}
.half.r{right:0;border-radius:0 100% 100% 0/0 50% 50% 0;border-left:none;transform-origin:0 0}
.pak.burst .half.l{transform:rotate(58deg)}.pak.burst .half.r{transform:rotate(-58deg)}
.pak.shake{animation:shake .25s linear infinite}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
.banner{position:absolute;left:50%;top:18%;width:78%;transform:translateX(-50%) scaleY(0);transform-origin:top;background:var(--bg);color:var(--fg);border:5px solid #fff;border-radius:8px;padding:.5em .2em;font-family:'Black Han Sans',sans-serif;font-size:clamp(22px,2.2vw,42px);line-height:1.2;transition:transform .6s .2s cubic-bezier(.3,1.5,.5,1);z-index:2}
.pak.burst .banner{transform:translateX(-50%) scaleY(1)}
/* 줄다리기 */
.tug{position:relative;height:170px;margin:18px 0 6px}
.side{position:absolute;top:0;bottom:0;width:12%;border-radius:20px;display:grid;place-items:center;font-size:clamp(22px,2.4vw,44px);border:5px solid #fff}
.side.l{left:0;background:var(--blue)}.side.r{right:0;background:#fff;color:var(--ink);border-color:var(--ink)}
.rope{position:absolute;left:12%;right:12%;top:50%;height:22px;margin-top:-11px;border-radius:11px;background:repeating-linear-gradient(135deg,#C99A5B 0 14px,#A87B40 14px 28px);box-shadow:0 5px 0 rgba(0,0,0,.25)}
.midl{position:absolute;left:50%;top:10px;bottom:10px;border-left:4px dashed rgba(255,255,255,.8)}
.goal{position:absolute;top:18px;bottom:18px;width:8px;background:var(--yellow);border-radius:4px}
.ribbon{position:absolute;top:50%;transition:left .12s linear}
.ribbon::before{content:"";position:absolute;left:-26px;top:-70px;border-left:26px solid transparent;border-right:26px solid transparent;border-top:60px solid var(--red);filter:drop-shadow(0 4px 0 rgba(0,0,0,.3))}
.rounds{text-align:center;font-size:clamp(26px,2.6vw,48px);margin-top:4px}
.tavg{display:flex;justify-content:space-between;font-size:clamp(18px,1.7vw,30px);margin:0 12%}
/* 달리기 */
.lanes{display:flex;flex-direction:column;gap:3px;margin-top:8px}
.rl{display:grid;grid-template-columns:3.6em 1fr 3.4em;align-items:center;gap:10px;font-size:clamp(13px,1.15vw,20px)}
.rl .tn{text-align:right;font-family:'Black Han Sans',sans-serif}
.track{position:relative;height:clamp(14px,1.6vh,26px);background:rgba(255,255,255,.15);border-radius:8px}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;width:0;transition:width .12s}
.track b{position:absolute;top:50%;transform:translate(-50%,-50%) scaleX(-1);font-size:1.25em;transition:left .12s}
.track::after{content:"";position:absolute;right:-2px;top:-4px;bottom:-4px;width:6px;background:repeating-linear-gradient(0deg,#fff 0 5px,#1B2430 5px 10px)}
.rl .cn{font-family:'Black Han Sans',sans-serif}
/* 윷놀이 */
.yut{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:center}
.yboard{position:relative;aspect-ratio:1;width:100%;max-width:60vh;margin:auto;background:#6b4423 repeating-linear-gradient(90deg,#6b4423 0 22px,#704826 22px 44px);border-radius:24px;border:6px solid #fff}
.yboard svg{position:absolute;inset:0;width:100%;height:100%}
.st{position:absolute;width:5%;aspect-ratio:1;border-radius:50%;background:#F3D9A4;transform:translate(-50%,-50%);display:grid;place-items:center;font-size:clamp(10px,.8vw,14px);color:var(--ink)}
.st.big{width:9%;background:var(--yellow)}
.tok{position:absolute;width:9%;aspect-ratio:1;border-radius:50%;background:var(--bg);color:var(--fg);border:4px solid #fff;transform:translate(-50%,-50%);display:grid;place-items:center;font-family:'Black Han Sans',sans-serif;font-size:clamp(16px,1.8vw,32px);transition:left .3s,top .3s;z-index:2;box-shadow:0 5px 0 rgba(0,0,0,.3)}
.tok.w{border-color:var(--ink)}
.tok.home{outline:6px solid var(--yellow)}
.sticks{display:flex;gap:16px;justify-content:center;margin-top:14px}
.sticks i{width:clamp(34px,3vw,56px);height:clamp(120px,12vw,210px);border-radius:30px;background:#7a4a21;box-shadow:inset -8px 0 0 rgba(0,0,0,.2);position:relative}
.sticks i.f{background:#F3D9A4;box-shadow:inset -4px 0 0 rgba(0,0,0,.1)}
.sticks i.f.x::after{content:"✕";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#7a4a21;font-size:26px}
.ybig{text-align:center;font-size:clamp(60px,7vw,130px);color:var(--yellow);min-height:1.1em;text-shadow:0 6px 0 rgba(0,0,0,.3)}
@media (max-width:900px){.yut{grid-template-columns:1fr}}
.scoreov{position:fixed;inset:0;background:rgba(12,40,24,.9);display:none;flex-direction:column;align-items:center;justify-content:center;gap:26px;z-index:58;cursor:pointer;padding:20px}
.scoreov.show{display:flex;animation:soin .35s ease}
@keyframes soin{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.scoreov h2{margin:0;font-size:clamp(36px,4.2vw,80px);color:var(--yellow);text-align:center;text-shadow:0 5px 0 rgba(0,0,0,.35)}
.sopan{display:flex;gap:30px;flex-wrap:wrap;justify-content:center}
.sop{background:var(--bg);color:var(--fg);border:8px solid #fff;border-radius:32px;padding:18px 40px;text-align:center;min-width:min(40vw,560px);box-shadow:0 12px 0 rgba(0,0,0,.3)}
.sop.w{border-color:var(--ink)}
.sop.lead{outline:10px solid var(--yellow);outline-offset:4px}
.sop .nm{font-size:clamp(36px,4vw,76px)}.sop .sc{font-size:clamp(100px,12vw,230px);line-height:1}
.sop .gain{font-size:clamp(30px,3vw,56px);color:#F4B400;-webkit-text-stroke:1px rgba(0,0,0,.35)}
.sohint{font-size:clamp(16px,1.4vw,24px);opacity:.75;margin:0}
/* 시상식 */
.podium{display:flex;flex-direction:column;gap:18px;max-width:1000px;margin:30px auto 0}
.pod{display:flex;align-items:center;gap:24px;background:rgba(255,255,255,.18);border:4px dashed rgba(255,255,255,.7);border-radius:24px;padding:18px 30px}
.pod>span{visibility:hidden}
.pod.show{background:var(--bg);color:var(--fg);border:5px solid #fff}
.pod.show.w{border-color:var(--ink)}
.pod.show>span{visibility:visible}
.pod.first{box-shadow:0 0 0 8px var(--yellow)}
.prank{font-size:clamp(34px,3.4vw,62px);width:2.4em}.pname{flex:1;font-size:clamp(44px,4.8vw,92px)}.pscore{font-size:clamp(34px,3.4vw,62px)}
/* 모달 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.open{display:flex}
.sheet{background:#fff;color:var(--ink);border-radius:26px;padding:26px 30px;width:min(900px,94vw);max-height:92vh;overflow:auto}
.sheet h3{margin:0 0 8px;font-size:clamp(26px,2.5vw,42px)}
.sheet h4{margin:18px 0 6px;font-size:22px}
.sheet .btn{border:3px solid var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.25)}
.sheet .row{justify-content:flex-start}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{display:grid;gap:5px;font-size:17px}
.form label.full,.form .full{grid-column:1/-1}
.mslot{font-size:17px;border-top:1px solid #e3e6ea;padding-top:10px}
.form input,.form textarea{font-size:18px;padding:9px 12px;border:3px solid #c9ced6;border-radius:12px;color:var(--ink);font-weight:700}
.form textarea{font-family:monospace;font-size:14px}
.note{font-size:16px;color:#55606e;font-weight:700;line-height:1.5}
.ok{color:#1a7f37}.bad{color:var(--red)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.shout{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:55;opacity:0}
.shout span{font-family:'Black Han Sans',sans-serif;font-size:clamp(70px,11vw,220px);line-height:1.1;text-align:center;background:var(--bg,#D62839);color:var(--fg,#fff);border:10px solid #fff;border-radius:36px;padding:.12em .5em;box-shadow:0 14px 0 rgba(0,0,0,.3)}
.shout.show{animation:sh 2.6s ease forwards}
@keyframes sh{0%{opacity:0;transform:scale(.4)}12%{opacity:1;transform:scale(1.08)}20%{transform:scale(1)}82%{opacity:1}100%{opacity:0}}
@media (max-width:900px){.top{padding:0 16px 90px}.tools{top:auto;bottom:6px;right:50%;transform:translateX(50%)}.badge{position:static;margin:6px auto}.lobby{grid-template-columns:1fr;justify-items:center}.form{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="shout" id="shout"><span></span></div>
<canvas id="fx"></canvas>

<script>
/* =========================================================
   공통
   ========================================================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TEAM=[{bg:'#1E56C4',fg:'#FFFFFF'},{bg:'#FFFFFF',fg:'#1B2430'}];

/* 소리 */
let AC=null;
function ac(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function tone(f,d,type='sine',v=.25,w=0){const a=ac();if(!a)return;const t=a.currentTime+w,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05)}
function noise(d,v=.3,ff=1200,w=0,type='bandpass',att=.005){const a=ac();if(!a)return;const t=a.currentTime+w,n=Math.floor(a.sampleRate*d);
  const b=a.createBuffer(1,n,a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<n;i++)ch[i]=Math.random()*2-1;
  const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type=type;f.frequency.value=ff;const g=a.createGain();
  g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(v,t+att);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f).connect(g).connect(a.destination);s.start(t)}
const SFX={
  whistle(d=.6){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),l=a.createOscillator(),lg=a.createGain(),g=a.createGain();
    o.frequency.value=2900;l.frequency.value=32;lg.gain.value=180;l.connect(lg).connect(o.frequency);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.25,t+.03);
    g.gain.setValueAtTime(.25,t+d-.08);g.gain.linearRampToValueAtTime(0,t+d);o.connect(g).connect(a.destination);o.start(t);l.start(t);o.stop(t+d+.05);l.stop(t+d+.05)},
  fanfare(){[[523,0],[659,.14],[784,.28],[1047,.42]].forEach(([f,w])=>{tone(f,.22,'square',.1,w);tone(f/2,.22,'triangle',.15,w)});[1047,1319,1568].forEach(f=>tone(f,1.2,'triangle',.12,.62))},
  beep(hi){tone(hi?1320:880,hi?.35:.15,'square',.12)},
  ding(){tone(1320,.35,'triangle',.18)},
  buzz(){tone(160,.35,'sawtooth',.12)},
  pop(){noise(.4,.7,800,0,'lowpass');tone(70,.45,'sine',.6)},
  cheer(){noise(2.4,.25,1100,0,'bandpass',.6);noise(2.4,.14,2400,.1,'bandpass',.7)},
  drumroll(d=2){for(let x=0;x<d;x+=.055)noise(.05,.15+.3*(x/d),400,x,'lowpass');noise(1.1,.35,6000,d,'highpass');tone(80,.5,'sine',.5,d)},
  thump(){tone(120,.2,'sine',.35)},
  tick(){tone(1500,.04,'square',.05)}
};
function say(text,rate){if(!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';if(rate)u.rate=rate;
  const v=speechSynthesis.getVoices().find(v=>(v.lang||'').toLowerCase().startsWith('ko'));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
if('speechSynthesis' in window)speechSynthesis.getVoices();

const cv=$('#fx'),cx=cv.getContext('2d');let parts=[],craf=null;
function resize(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}addEventListener('resize',resize);resize();
function confetti(cs){cs=cs||['#D62839','#F4B400','#1E56C4','#FFFFFF','#2BB673','#FF7A1A'];const d=devicePixelRatio;
  for(let i=0;i<220;i++)parts.push({x:cv.width*Math.random(),y:-cv.height*.4*Math.random(),vx:(Math.random()-.5)*6*d,vy:(2+Math.random()*4)*d,r:(8+Math.random()*9)*d,a:Math.random()*6,va:(Math.random()-.5)*.3,c:cs[i%cs.length]});
  if(!craf)cloop()}
function cloop(){cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.y<cv.height+40);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.04*devicePixelRatio;p.a+=p.va;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore()});
  craf=parts.length?requestAnimationFrame(cloop):null}
function shout(text,k){const el=$('#shout');el.querySelector('span').innerHTML=esc(text).replace(/\n/g,'<br>');el.style.cssText=k==null?'':tstyle(k);el.classList.remove('show');void el.offsetWidth;el.classList.add('show')}

/* =========================================================
   배경 음악 (TV에서만) — 이 파일을 위해 새로 작곡한 곡들
   ========================================================= */
const MUSIC=(function(){
  const SEMI={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
  const nf=n=>{const m=/^([A-G])([#b]?)(\d)$/.exec(n);const s=SEMI[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0);return 440*Math.pow(2,(12*(+m[3]+1)+s-69)/12)};
  const SONGS={
    wait:{bpm:96,spb:16,style:'calm',lead:'bell',chords:'F F Bb F Gm C F F',
      mel:'A5:4 C6:4 A5:4 F5:4 G5:4 A5:4 C5:8 D6:4 C6:4 Bb5:4 D5:4 C6:8 A5:8 Bb5:4 A5:4 G5:4 D5:4 E5:4 G5:4 C6:4 Bb5:4 A5:4 G5:4 F5:4 C5:4 F5:12 r:4'},
    march:{bpm:116,spb:16,style:'march',lead:'brass',chords:'C C G G C F G C F C F C Dm G C C',
      mel:'E5:4 G5:4 C6:4 G5:4 E5:3 F5:1 G5:4 E5:4 C5:4 D5:4 G5:4 B5:4 G5:4 F5:3 E5:1 D5:4 B4:4 G4:4 C5:4 E5:4 G5:4 C6:4 A5:4 F5:4 C6:4 A5:4 G5:3 A5:1 G5:4 F5:4 D5:4 C5:8 G4:4 C5:4 '+
          'A5:4 A5:2 G5:2 F5:4 A5:4 G5:4 E5:2 D5:2 C5:4 E5:4 F5:2 G5:2 A5:2 B5:2 C6:4 A5:4 G5:12 r:4 F5:4 E5:2 F5:2 D5:4 F5:4 G5:4 F5:2 E5:2 D5:4 B4:4 C5:2 E5:2 G5:2 C6:2 B5:2 A5:2 G5:2 F5:2 E5:4 D5:4 C5:8'},
    galop:{bpm:150,spb:16,style:'galop',lead:'square',chords:'G G D D G C D G',
      mel:'D5:2 D5:2 G5:2 B5:2 A5:2 G5:2 F#5:2 G5:2 A5:4 G5:2 E5:2 D5:4 r:4 F#5:2 F#5:2 A5:2 D6:2 C6:2 A5:2 F#5:2 A5:2 G5:4 F#5:2 E5:2 D5:4 r:4 '+
          'B5:2 B5:2 B5:2 C6:2 D6:4 B5:4 C6:2 C6:2 C6:2 B5:2 A5:4 E5:4 D5:2 E5:2 F#5:2 G5:2 A5:2 B5:2 C6:2 A5:2 G5:4 D5:4 G5:4 r:4'},
    jajin:{sd:.15,spb:12,style:'jajin',lead:'piri',chords:'D D D D D D D D',
      mel:'D5:3 E5:3 G5:3 A5:3 G5:2 A5:1 G5:3 E5:3 D5:3 E5:3 G5:3 A5:3 C6:3 D6:6 C6:3 A5:3 C6:3 A5:3 G5:3 E5:3 G5:2 E5:1 D5:3 E5:3 G5:3 A5:3 G5:3 E5:2 D5:1 E5:3 D5:9 r:3'}
  };
  for(const k in SONGS){const s=SONGS[k];s.sd=s.sd||60/s.bpm/4;s.ch=s.chords.split(' ');s.total=s.ch.length*s.spb;s.ev={};let p=0;
    for(const tok of s.mel.trim().split(/\s+/)){const [n,d]=tok.split(':');if(n!=='r')s.ev[p]=[nf(n),+d];p+=+d}s.len=p}
  let cfg=Object.assign({on:true,vol:55},store.get('sd-music',{}));
  let master=null,curKey,inst=null,lastG='lobby',lastPh='ready';const custom={};
  const SLOT={wait:'wait',galop:'play',march:'cheer'};
  function M(){const a=ac();if(!a)return null;if(!master){master=a.createGain();master.gain.value=cfg.vol/100*.8;master.connect(a.destination)}return master}
  function env(a,dest,t,d,v,att=.01){const g=a.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+att);g.gain.setValueAtTime(v,t+Math.max(att,d*.6));g.gain.exponentialRampToValueAtTime(.0001,t+d);g.connect(dest);return g}
  function osc(a,type,f,t,d,dest){const o=a.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);o.connect(dest);o.start(t);o.stop(t+d+.05);return o}
  function lead(a,dest,kind,f,t,d){
    if(kind==='bell'){osc(a,'triangle',f,t,d*1.6,env(a,dest,t,d*1.6,.13,.005));osc(a,'sine',f*2,t,d,env(a,dest,t,d,.04,.005));return}
    const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=kind==='piri'?1700:kind==='brass'?2400:3200;lp.connect(dest);
    const g=env(a,lp,t,d,kind==='brass'?.1:kind==='piri'?.09:.06,kind==='brass'?.03:.01);
    const o=osc(a,kind==='square'?'square':'sawtooth',f,t,d,g);
    if(kind==='piri'){const l=a.createOscillator(),lg=a.createGain();l.frequency.value=6;lg.gain.value=f*.012;l.connect(lg).connect(o.frequency);l.start(t);l.stop(t+d+.05)}
  }
  const bassN=(a,dest,f,t,d,v)=>osc(a,'triangle',f,t,d,env(a,dest,t,d,v,.01));
  function nz(a,dest,t,d,v,type,ff){const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=Math.random()*2-1;
    const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type=type;f.frequency.value=ff;const g=a.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f).connect(g).connect(dest);s.start(t)}
  function kick(a,dest,t,v=.45,f0=130,f1=45){const o=a.createOscillator(),g=a.createGain();o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+.16);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.connect(g).connect(dest);o.start(t);o.stop(t+.25)}
  const snare=(a,d,t,v=.2)=>{nz(a,d,t,.13,v,'bandpass',1900);osc(a,'triangle',190,t,.08,env(a,d,t,.08,v*.6,.002))};
  const hat=(a,d,t,v=.05)=>nz(a,d,t,.04,v,'highpass',7000);
  const tak=(a,d,t,v=.22)=>{nz(a,d,t,.05,v,'highpass',2500);osc(a,'square',950,t,.04,env(a,d,t,.04,v*.25,.001))};
  function triad(name){const m=/^([A-G][#b]?)(m?)$/.exec(name);const r=nf(m[1]+'3'),third=m[2]?1.1892:1.2599;return{root:r,fifth:r*1.4983,hi:[r*2,r*2*third,r*2*1.4983]}}
  function stepAt(a,S,step,t,dest){
    const bar=Math.floor(step/S.spb),s=step%S.spb,sd=S.sd,tr=triad(S.ch[bar%S.ch.length]);
    const e=S.ev[step];if(e)lead(a,dest,S.lead,e[0],t,e[1]*sd*.92);
    if(S.style==='march'){
      if(s===0||s===8){bassN(a,dest,s?tr.fifth:tr.root,t,sd*3.5,.24);kick(a,dest,t,.35)}
      if(s===4||s===12){tr.hi.forEach(f=>bassN(a,dest,f,t,sd*2,.045));snare(a,dest,t,.16)}
      if(bar%8===7&&s>=12)snare(a,dest,t,.06+.03*(s-12));
    }else if(S.style==='galop'){
      if(s%4===0)bassN(a,dest,s%8===0?tr.root:tr.fifth,t,sd*1.8,.22);
      if(s%4===2)tr.hi.forEach(f=>bassN(a,dest,f,t,sd,.04));
      if(s===0||s===8)kick(a,dest,t,.4);if(s===4||s===12)snare(a,dest,t,.17);if(s%2===0)hat(a,dest,t);
    }else if(S.style==='calm'){
      if(s===0){bassN(a,dest,tr.root,t,sd*14,.12);tr.hi.forEach(f=>bassN(a,dest,f,t,sd*15,.025))}
      if(s===8)bassN(a,dest,tr.fifth,t,sd*7,.08);
      if(s===4||s===12)hat(a,dest,t,.025);
    }else if(S.style==='jajin'){
      if(s===0){bassN(a,dest,nf('D3'),t,sd*12,.07);bassN(a,dest,nf('A3'),t,sd*12,.05);kick(a,dest,t,.5,95,55);tak(a,dest,t)}
      if(s===3||s===7)tak(a,dest,t);if(s===5||s===9)kick(a,dest,t,.32,110,60);if(s===11)tak(a,dest,t,.1);
    }
  }
  function startSynth(key){
    const a=ac(),m=M();if(!a||!m)return null;const S=SONGS[key];
    const g=a.createGain();g.gain.setValueAtTime(.0001,a.currentTime);g.gain.linearRampToValueAtTime(1,a.currentTime+.6);g.connect(m);
    const me={g,step:0,next:a.currentTime+.08};
    me.iv=setInterval(()=>{if(a.state!=='running'){me.next=a.currentTime+.08;return}
      while(me.next<a.currentTime+.15){stepAt(a,S,me.step,me.next,g);me.next+=S.sd;me.step=(me.step+1)%S.total}},25);
    me.stop=()=>{clearInterval(me.iv);try{g.gain.cancelScheduledValues(a.currentTime);g.gain.setValueAtTime(g.gain.value,a.currentTime);g.gain.linearRampToValueAtTime(.0001,a.currentTime+.5)}catch(e){}setTimeout(()=>{try{g.disconnect()}catch(e){}},800)};
    return me;
  }
  function startAudio(url){
    const el=new Audio(url);el.loop=true;el.volume=0;el.play().catch(()=>{});
    const target=()=>Math.min(1,cfg.vol/100);let v=0;const up=setInterval(()=>{v=Math.min(target(),v+.05);el.volume=v;if(v>=target())clearInterval(up)},50);
    return{el,stop(){clearInterval(up);const dn=setInterval(()=>{el.volume=Math.max(0,el.volume-.08);if(el.volume<=0){clearInterval(dn);el.pause()}},50)}};
  }
  function keyFor(g,ph){
    if(g==='lobby')return 'wait';
    if(g==='award')return 'march';
    if(ph==='end')return null;
    if(g==='yut')return ph==='count'?null:'jajin';
    if(g==='flag')return ph==='ready'?'wait':null;
    if(ph==='count')return null;
    if(ph==='go'||ph==='wait')return 'galop';
    return 'wait';
  }
  function scene(g,ph){
    lastG=g;lastPh=ph;const key=cfg.on?keyFor(g,ph):null;
    if(key===curKey)return;curKey=key;
    if(inst){inst.stop();inst=null}
    if(!key)return;
    const c=custom[SLOT[key]];inst=c?startAudio(c.url):startSynth(key);
  }
  function refresh(){curKey=undefined;scene(lastG,lastPh)}
  function setVol(v){cfg.vol=v;store.set('sd-music',cfg);if(master)master.gain.value=v/100*.8;if(inst&&inst.el)inst.el.volume=Math.min(1,v/100)}
  function toggle(on){cfg.on=on;store.set('sd-music',cfg);refresh()}
  const IDB={db:null,
    open(){return new Promise((res,rej)=>{try{const r=indexedDB.open('sd-music',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(this.db=r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
    async get(k){const db=this.db||await this.open();return new Promise(res=>{const q=db.transaction('f').objectStore('f').get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})},
    async set(k,v){const db=this.db||await this.open();return new Promise(res=>{const t=db.transaction('f','readwrite');const st=t.objectStore('f');v==null?st.delete(k):st.put(v,k);t.oncomplete=()=>res(true);t.onerror=()=>res(false)})}};
  async function loadCustom(){for(const s of ['wait','play','cheer']){try{const v=await IDB.get(s);if(custom[s])URL.revokeObjectURL(custom[s].url);custom[s]=v?{name:v.name,url:URL.createObjectURL(v.blob)}:null}catch(e){custom[s]=custom[s]||null}}}
  async function setCustom(slot,file){let ok=false;try{ok=await IDB.set(slot,file?{name:file.name,blob:file}:null)}catch(e){}
    if(!ok&&file){if(custom[slot])URL.revokeObjectURL(custom[slot].url);custom[slot]={name:file.name,url:URL.createObjectURL(file)}}else await loadCustom();refresh();return ok}
  return{scene,setVol,toggle,refresh,loadCustom,setCustom,custom,get cfg(){return cfg},SONGS};
})();

/* =========================================================
   핸드폰 화면
   ========================================================= */
function phoneMain(){
  const app=$('#app');
  /* 화면을 쓸거나 당겨도 페이지를 벗어나지 않게 */
  document.documentElement.classList.add('isphone');
  const stop=e=>{if(e.cancelable)e.preventDefault()};
  document.addEventListener('touchmove',stop,{passive:false});
  ['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,stop,{passive:false}));
  let lastTouch=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTouch<350&&e.cancelable&&!e.target.closest('.plink'))e.preventDefault();lastTouch=n},{passive:false});
  let trapped=false;const trap=()=>{if(!trapped){try{history.pushState({stay:1},'',location.href);trapped=true}catch(e){}}};
  addEventListener('popstate',()=>{trapped=false;trap()});
  document.addEventListener('pointerdown',trap,{capture:true});
  addEventListener('beforeunload',e=>{if(me){e.preventDefault();e.returnValue='';return ''}});
  const note=t=>{app.innerHTML=`<div class="pjoin"><h1 class="display">손가락 운동회</h1><p>${t}</p></div>`};
  if(!TVID){note('TV 화면의 QR코드를<br>핸드폰 카메라로<br>찍어 주세요.');return}
  let pid=store.get('sd-pid',null);if(!pid){pid='p'+Math.random().toString(36).slice(2,10);store.set('sd-pid',pid)}
  const MEKEY='sd-me-'+TVID;
  let me=store.get(MEKEY,null),state={},conn=null,connected=false,taps=0,round=-1,dirty=false,myAns={},peer=null,retry=null,openTimer=null;
  const wake=()=>{try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}};wake();
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){wake();if(!connected)connect()}});
  const send=m=>{if(conn&&conn.open){try{conn.send(m)}catch(e){}}};

  function connect(){
    clearTimeout(retry);clearTimeout(openTimer);
    if(!window.Peer){render();retry=setTimeout(()=>location.reload(),6000);return}
    if(!peer||peer.destroyed){
      peer=makePeer();if(!peer){retry=setTimeout(connect,3000);return}
      peer.on('error',()=>{connected=false;render();clearTimeout(retry);retry=setTimeout(connect,2500)});
      peer.on('disconnected',()=>{setTimeout(()=>{try{if(!peer.destroyed)peer.reconnect()}catch(e){}},1000)});
    }
    const go=()=>{
      if(conn){try{conn.close()}catch(e){}}
      const c=peer.connect(TVID,{reliable:true});conn=c;
      openTimer=setTimeout(()=>{if(!c.open){try{c.close()}catch(e){}connect()}},9000);
      c.on('open',()=>{clearTimeout(openTimer);connected=true;if(me)send({t:'join',pid,team:me.team});render();showJoinState()});
      c.on('data',onData);
      c.on('close',()=>{if(conn===c){connected=false;render();showJoinState();clearTimeout(retry);retry=setTimeout(connect,2000)}});
      c.on('error',()=>{});
    };
    if(peer.open)go();else peer.once('open',go);
  }
  function onData(m){
    if(!m||typeof m!=='object')return;
    if(m.t==='state'){state=m.s||{};if(state.round!=null&&state.round!==round){round=state.round;taps=0;dirty=true;flush()}render()}
    else if(m.t==='you'){const changed=!me||me.num!==m.num||me.team!==m.team;me={team:m.team,num:m.num};store.set(MEKEY,me);if(changed||!$('#phone'))showPlay();else render()}
    else if(m.t==='kick'){me=null;store.set(MEKEY,null);showJoin()}
  }
  function showJoinState(){
    const j=$('#jmsg');if(!j)return;
    j.textContent=connected?'':'TV와 연결하는 중이에요...';
    app.querySelectorAll('.teambtn').forEach(b=>b.disabled=!connected);
  }
  function showJoin(){
    document.body.style.background='';
    app.innerHTML=`<div class="pjoin"><h1 class="display">손가락 운동회</h1><p>어느 팀이세요?</p>
      <button class="teambtn" style="${tstyle(0)}" data-k="0">${esc((state.names||['청팀'])[0])}</button><button class="teambtn w" style="${tstyle(1)}" data-k="1">${esc((state.names||['','백팀'])[1])}</button>
      <p id="jmsg" style="font-size:20px;opacity:.85;min-height:1.4em"></p></div>`;
    app.querySelectorAll('.teambtn').forEach(b=>b.onclick=()=>{
      if(!connected){showJoinState();return}
      app.querySelectorAll('.teambtn').forEach(x=>x.disabled=true);$('#jmsg').textContent='들어가는 중...';
      send({t:'join',pid,team:+b.dataset.k});
      setTimeout(()=>{if(!me&&$('#jmsg')){$('#jmsg').textContent='다시 한 번 눌러 주세요';app.querySelectorAll('.teambtn').forEach(x=>x.disabled=false)}},5000);
    });
    showJoinState();
  }
  function showPlay(){
    app.innerHTML=`<section id="phone">
      <div class="ptop"><div class="pwho display" id="pWho"></div><div class="pstatus display" id="pStatus"></div></div>
      <button class="tap" id="tapBtn">톡!</button>
      <div class="flags hidden" id="flags"><button class="fbtn b" data-v="b">청기</button><button class="fbtn wf" data-v="w">백기</button></div>
      <div class="ptop"><div class="pcount display" id="pCount"></div><button class="plink" id="pLeave">팀 바꾸기</button></div></section>`;
    const tapBtn=$('#tapBtn');
    tapBtn.addEventListener('pointerdown',e=>{e.preventDefault();if(!canTap())return;taps++;dirty=true;
      tapBtn.classList.add('hit');setTimeout(()=>tapBtn.classList.remove('hit'),60);try{navigator.vibrate&&navigator.vibrate(10)}catch(x){}
      $('#pCount').textContent=`${taps}번 두드렸어요`});
    app.querySelectorAll('.fbtn').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();
      const c=state.cmd;if(!connected||state.game!=='flag'||state.phase!=='go'||!c||myAns[c.id]!=null)return;
      const v=b.dataset.v;myAns[c.id]=v;send({t:'ans',pid,c:c.id,v});b.classList.add('hit');setTimeout(()=>b.classList.remove('hit'),120);
      try{navigator.vibrate&&navigator.vibrate(30)}catch(x){}render()}));
    ['contextmenu','dblclick'].forEach(ev=>app.addEventListener(ev,e=>e.preventDefault()));
    $('#pLeave').onclick=()=>{if(confirm('팀을 바꿀까요?')){send({t:'leave',pid});me=null;store.set(MEKEY,null);showJoin()}};
    render();
  }
  function canTap(){
    if(!me||!connected||state.phase!=='go'||state.round!==round)return false;
    const g=state.game;
    if(['open','snow','volley','pak','tug','race'].includes(g))return true;
    if(g==='relay')return !!(state.turn&&state.turn[me.team]===pid);
    if(g==='yut')return state.turnTeam===me.team;
    return false;
  }
  function render(){
    if(!me||!$('#phone'))return;
    const k=me.team,names=state.names||['청팀','백팀'],g=state.game,ph=state.phase;
    document.body.style.background=k?'#2A7043':'#173a80';
    $('#pWho').textContent=`${names[k]} ${me.num}번 선수`;
    const isFlag=g==='flag';
    $('#tapBtn').classList.toggle('hidden',isFlag||g==='award');$('#flags').classList.toggle('hidden',!isFlag);
    const tb=$('#tapBtn');tb.style.cssText=tstyle(k);tb.classList.toggle('w',k===1);
    const ok=canTap();tb.classList.toggle('off',!ok);tb.textContent=ok?'톡!':(ph==='count'?String(state.cnt||''):'잠깐만요');
    let s='';
    if(!connected)s='TV와 연결하는 중...';
    else if(!g||g==='lobby')s='곧 시작해요!<br>잠시만 기다려 주세요';
    else if(g==='award')s='수고 많으셨어요! 👏';
    else if(ph==='count')s=`준비! ${state.cnt||''}`;
    else if(isFlag){
      const c=state.cmd,v=c?myAns[c.id]:null;
      app.querySelectorAll('.fbtn').forEach(b=>b.classList.toggle('off',!(ph==='go'&&c&&v==null)));
      if(ph==='go'&&c)s=v?`${v==='b'?'청기':'백기'}를 눌렀어요`:esc(c.text);
      else if(ph==='reveal'&&c){const good=c.a==='x'?v==null:v===c.a;s=good?'⭕ 맞았어요!':'❌ 아쉬워요!'}
      else if(ph==='end')s='끝! 잘하셨어요 👏';
      else s=esc(state.tip||'곧 시작해요').replace(/\n/g,'<br>');
    }
    else if(ph==='wait')s=g==='yut'?'윷을 던지는 중...':'잠깐만요...';
    else if(ph==='go'){
      if(g==='relay'){
        if(ok)s='지금 내 차례!<br>빨리 두드리세요!';
        else{const ord=(state.order&&state.order[k])||[],i=ord.indexOf(pid),c=ord.indexOf(state.turn&&state.turn[k]);
          s=c<0?'우리 팀 끝! 응원해요 👏':i>c?`내 차례까지<br>${i-c}명 남았어요`:i<0?'응원해 주세요!':'잘하셨어요!<br>응원해 주세요'}
      }else if(g==='yut')s=ok?'우리 팀 차례!<br>두드려서 윷을 던져요!':'상대 팀 차례예요<br>응원해 주세요!';
      else s='지금 두드리세요!';
    }
    else if(ph==='end')s='끝! 잘하셨어요 👏';
    else s=esc(state.tip||'곧 시작해요').replace(/\n/g,'<br>');
    $('#pStatus').innerHTML=s;
    $('#pCount').textContent=!isFlag&&round===state.round&&ph!=='ready'&&g!=='award'&&g!=='lobby'?`${taps}번 두드렸어요`:'';
  }
  function flush(){if(!dirty||!connected||!me)return;dirty=false;send({t:'taps',pid,round,taps})}
  setInterval(flush,150);
  setInterval(()=>{if(connected&&me)send({t:'hb',pid,team:me.team})},2000);
  if(me)showPlay();else showJoin();
  connect();
}

/* =========================================================
   TV 화면
   ========================================================= */
function tvMain(){
  const GAMEVER=3,GDEF={tugSec:25,raceGoal:200,pakPer:150,relayLeg:30,flagCount:15,volleyPts:5,snowSec:60,openPer:80,volleyNeed:12,yutNeed:15};
  const DEF=Object.assign({names:['청팀','백팀'],scores:[0,0],history:[],done:{},win:100,practice:false,phoneUrl:'',ver:GAMEVER},GDEF);
  const RAW=store.get('fg-tv',{})||{};const S=Object.assign({},DEF,RAW);const save=()=>store.set('fg-tv',S);
  if(RAW.ver!==GAMEVER){Object.assign(S,GDEF);S.ver=GAMEVER;save()}
  const H={game:'lobby',phase:'ready',round:Math.floor(Date.now()/1000)%1000000,cnt:0,tip:'',cmd:null,turn:null,order:null,names:S.names};
  let players={},FLAG={id:0,a:null};

  const app=$('#app');
  app.innerHTML=`<div class="bunting" id="bunting"></div>
    <header class="top"><div class="badge" id="badge"></div><h1 class="display">손가락 운동회</h1>
      <div class="tools"><button class="ghost" id="musBtn"></button><button class="ghost" id="setBtn">설정</button></div></header>
    <section class="board" id="board"></section>
    <div id="netWarn"></div>
    <nav class="tabs" id="tabs"></nav><main id="stage"></main>
    <div class="scoreov" id="scoreov"><h2 class="display" id="sotitle">현재 점수</h2><div class="sopan" id="sopan"></div><p class="sohint">화면을 누르거나 리모컨 다음 버튼을 누르면 닫혀요</p></div>`;
  (function(){const n=28,cs=['#D62839','#F4B400','#1E56C4','#FFFFFF','#2BB673','#FF7A1A'];
    let s='<svg viewBox="0 0 1000 52" preserveAspectRatio="none"><path d="M0,4 Q500,38 1000,4" stroke="#fff" stroke-width="2" fill="none"/>';
    for(let i=0;i<n;i++){const t=(i+.5)/n,x=1000*t,y=4*(1-t)*(1-t)+76*t*(1-t)+4*t*t;s+=`<polygon points="${x-13},${y} ${x+13},${y} ${x},${y+22}" fill="${cs[i%cs.length]}"/>`}
    $('#bunting').innerHTML=s+'</svg>'})();

  /* ---------- 연결 (핸드폰과 TV를 직접 연결) ---------- */
  let peer=null,live=false;const conns=new Set();
  let roster=store.get('sd-roster',{});const counters=[0,0];
  Object.values(roster).forEach(r=>{if(r&&(r.team===0||r.team===1))counters[r.team]=Math.max(counters[r.team],r.num||0)});
  function tvId(){let id=store.get('sd-tvid',null);if(!id){id='together-undong-'+Math.random().toString(36).slice(2,8);store.set('sd-tvid',id)}return id}
  function broadcast(m){for(const c of conns){if(c.open){try{c.send(m)}catch(e){}}}}
  function setH(p){Object.assign(H,p);broadcast({t:'state',s:H});MUSIC.scene(H.game,H.phase)}
  function startPeer(){
    peer=makePeer(tvId());if(!peer){netWarn();return}
    peer.on('open',()=>{live=true;badge();netWarn();if(H.game==='lobby'&&!running)gLobby()});
    peer.on('connection',c=>{
      c.on('open',()=>{conns.add(c);try{c.send({t:'state',s:H})}catch(e){}});
      c.on('data',m=>onMsg(c,m));
      c.on('close',()=>{conns.delete(c);const p=c._pid&&players[c._pid];if(p&&p._c===c){p.online=false;onPlayers()}});
      c.on('error',()=>{});
    });
    peer.on('disconnected',()=>{live=false;badge();setTimeout(()=>{try{if(!peer.destroyed)peer.reconnect()}catch(e){}},1500)});
    peer.on('error',e=>{if(e&&e.type==='unavailable-id'){store.set('sd-tvid',null);try{peer.destroy()}catch(x){}setTimeout(startPeer,500)}
      else if(e&&e.type!=='peer-unavailable'){live=false;badge()}});
  }
  function doJoin(c,pid,team){
      let r=roster[pid];
      if(r&&r.team!==team){delete roster[pid];r=null}
      if(!r){
        const isOn=q=>players[q]&&players[q].online!==false;
        const free=Object.entries(roster).filter(([q,x])=>q!==pid&&x&&x.team===team&&!isOn(q)).sort((a,b)=>a[1].num-b[1].num)[0];
        if(free){const [oldPid,x]=free;r={team,num:x.num};delete roster[oldPid];delete players[oldPid]}
        else{const used=new Set(Object.values(roster).filter(x=>x&&x.team===team).map(x=>x.num));let n=1;while(used.has(n))n++;r={team,num:n}}
        roster[pid]=r;store.set('sd-roster',roster);
      }
      c._pid=pid;const old=players[pid];
      players[pid]={team,num:r.num,online:true,_c:c,seen:Date.now(),taps:old&&old.team===team?old.taps:0,round:old?old.round:-1,joined:old?old.joined:Date.now()};
      try{c.send({t:'you',team,num:r.num});c.send({t:'state',s:H})}catch(e){}
      onPlayers();
  }
  function onMsg(c,m){
    if(!m||typeof m!=='object'||typeof m.pid!=='string')return;const pid=m.pid.slice(0,24);
    const pl=players[pid];if(pl&&pl._c){pl.seen=Date.now();if(pl.online===false&&pl._c===c){pl.online=true;onPlayers()}}
    if(m.t==='hb'){if(!pl||pl._c!==c)doJoin(c,pid,m.team===1?1:0);return}
    if(m.t==='join'){doJoin(c,pid,m.team===1?1:0)    }else if(m.t==='taps'){const p=players[pid];if(p){p.taps=Math.max(0,Math.min(100000,+m.taps||0));p.round=m.round}}
    else if(m.t==='ans'){const p=players[pid];if(p&&H.cmd&&m.c===H.cmd.id&&!(p.ans&&p.ans.c===m.c))p.ans={c:m.c,v:m.v==='b'?'b':m.v==='w'?'w':null}}
    else if(m.t==='leave'){delete players[pid];delete roster[pid];store.set('sd-roster',roster);onPlayers()}
  }
  function makeBots(){players={};for(const k of [0,1])for(let i=1;i<=10;i++)players[`bot${k}_${i}`]={team:k,num:i,taps:0,round:-1,online:true,joined:i,rate:4.5+Math.random()*2,acc:0,f:.3+Math.random()*.6,ph:Math.random()*6}}
  function kickAll(){
    if(S.practice){makeBots();onPlayers();return}
    broadcast({t:'kick'});players={};roster={};counters[0]=counters[1]=0;store.set('sd-roster',roster);onPlayers();
  }
  function netWarn(){
    const w=$('#netWarn');
    if(S.practice)w.innerHTML=`<div class="warn">지금은 <b>연습 모드</b>예요. 가상 선수 20명이 대신 두드려요. 실제 행사 때는 설정에서 연습 모드를 끄세요.</div>`;
    else if(!window.Peer)w.innerHTML=`<div class="warn">인터넷에 연결되어 있지 않아요. TV 컴퓨터의 인터넷을 확인한 뒤 새로 고침(F5) 해 주세요.</div>`;
    else if(!S.phoneUrl)w.innerHTML=`<div class="warn">처음 한 번만: 오른쪽 위 <b>설정</b>에서 <b>핸드폰 주소</b>(GitHub 주소)를 넣어 주세요. 먼저 구경만 하시려면 <b>연습 모드</b>를 켜세요.</div>`;
    else w.innerHTML='';
  }
  function onlineList(){return Object.entries(players).filter(([,p])=>p&&p.online!==false&&(p.team===0||p.team===1)).map(([pid,p])=>({...p,pid})).sort((a,b)=>a.team-b.team||(a.num||0)-(b.num||0))}
  function agg(){
    const T=[{n:0,sum:0,list:[]},{n:0,sum:0,list:[]}];
    for(const p of onlineList()){const t=T[p.team];t.n++;const taps=p.round===H.round?Math.max(0,Math.min(100000,+p.taps||0)):0;t.sum+=taps;t.list.push({...p,taps})}
    T.forEach(t=>t.avg=t.n?t.sum/t.n:0);return T;
  }
  function badge(){
    const T=agg();
    $('#badge').innerHTML=`${S.practice?'<b>연습 모드</b>':live?'<b>● 연결 준비 완료</b>':'연결 준비 중...'}<br>${esc(S.names[0])} ${T[0].n}명 · ${esc(S.names[1])} ${T[1].n}명`;
  }
  let lobbyDraw=null;
  function onPlayers(){badge();if(lobbyDraw)lobbyDraw()}
  function phoneUrl(){const base=(S.phoneUrl||'').trim();if(!base)return '';try{const u=new URL(base);u.search='';u.hash='';u.searchParams.set('id',tvId());u.searchParams.set('v',QRV);return u.toString()}catch(e){return ''}}
  setInterval(()=>{const now=Date.now();let ch=false;for(const p of Object.values(players)){if(p._c&&p.online!==false&&now-(p.seen||0)>6000){p.online=false;ch=true}}if(ch)onPlayers()},1000);
  if(S.practice)makeBots();else startPeer();

  /* 연습용 가상 선수 */
  function botStep(dt){
    if(!S.practice)return;const now=performance.now();
    for(const [pid,p] of Object.entries(players)){
      if(p.round!==H.round){p.round=H.round;p.taps=0;p.acc=0;p.ans=null;p._c=null}
      if(H.phase!=='go')continue;
      if(H.game==='flag'){
        if(H.cmd&&p._c!==H.cmd.id){p._c=H.cmd.id;p._at=now+400+Math.random()*1800;const r=Math.random();
          p._v=FLAG.a==='x'?(r<.25?(Math.random()<.5?'b':'w'):null):(r<.75?FLAG.a:r<.9?(FLAG.a==='b'?'w':'b'):null);
          if(FLAG.fake&&p._at<FLAG.fake.at&&Math.random()<.7)p._v=FLAG.fake.e}
        if(p._at&&now>=p._at){if(p._v)p.ans={c:H.cmd.id,v:p._v};p._at=0}
        continue;
      }
      if(H.game==='relay'&&!(H.turn&&H.turn[p.team]===pid))continue;
      if(H.game==='yut'&&H.turnTeam!==p.team)continue;
      p.acc+=p.rate*dt*(.6+Math.random()*.8)*(1+.4*Math.sin(now/1000*(p.f||.5)+(p.ph||0)));p.taps=Math.floor(p.acc);
    }
  }

  /* ---------- 점수판 ---------- */
  function renderBoard(){$('#board').innerHTML=[0,1].map(k=>`<button class="team ${k?'w':''}" data-k="${k}" style="${tstyle(k)}"><span class="tname display">${esc(S.names[k])}</span><span class="tscore display" id="sc${k}">${S.scores[k]}</span></button>`).join('');
    document.querySelectorAll('.team').forEach(b=>b.onclick=()=>adjust(+b.dataset.k))}
  function addPts(k,n,label){S.scores[k]+=n;S.history.push({k,n,label});save();renderBoard();$('#sc'+k).classList.add('bump')}
  function adjust(k){openModal(`<h3 class="display">${esc(S.names[k])} 점수 고치기</h3><div class="row">${[50,10,-10,-50].map(n=>`<button class="btn ${n>0?'go':''}" data-n="${n}">${n>0?'+':'−'}${Math.abs(n)}</button>`).join('')}
    <button class="btn small" id="ud">마지막 점수 되돌리기</button><button class="btn small" id="cl">닫기</button></div>`);
    $('#sheet').querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{addPts(k,+b.dataset.n,'점수 고치기');closeModal()});
    $('#ud').onclick=()=>{const h=S.history.pop();if(h){S.scores[h.k]-=h.n;save();renderBoard()}closeModal()};$('#cl').onclick=closeModal}
  function win(k,key,label){
    const before=S.scores.slice();
    if(k==null){SFX.whistle(1);shout('무승부!');timers.push(setTimeout(()=>showScores(null,before,label),1500));return}
    addPts(k,S.win,label);S.done[key]=true;save();SFX.whistle(.8);setTimeout(()=>{SFX.fanfare();SFX.cheer()},300);
    confetti([TEAM[k].bg,'#F4B400','#FFFFFF']);shout(`${S.names[k]} 승리!`,k);
    timers.push(setTimeout(()=>showScores(k,before,label),1800));
  }
  function showScores(k,before,label){
    const ov=$('#scoreov'),lead=S.scores[0]===S.scores[1]?null:(S.scores[0]>S.scores[1]?0:1);
    $('#sotitle').textContent=`${label} 끝! 현재 점수`;
    $('#sopan').innerHTML=[0,1].map(j=>`<div class="sop ${j?'w':''} ${lead===j?'lead':''}" style="${tstyle(j)}"><div class="nm display">${esc(S.names[j])}${lead===j?' 👑':''}</div>
      <div class="sc display" id="sov${j}">${before[j]}</div><div class="gain display">${j===k?'+'+S.win+'점':'&nbsp;'}</div></div>`).join('');
    ov.classList.add('show');
    const t0=performance.now();const tick=()=>{const p=Math.min(1,(performance.now()-t0)/1200);
      [0,1].forEach(j=>{const el=$('#sov'+j);if(el)el.textContent=Math.round(before[j]+(S.scores[j]-before[j])*p)});
      if(p<1&&ov.classList.contains('show'))requestAnimationFrame(tick)};requestAnimationFrame(tick);
    if(k!=null)SFX.ding();
  }
  const closeScores=()=>$('#scoreov').classList.remove('show');
  $('#scoreov').onclick=closeScores;

  /* ---------- 경기 틀 ---------- */
  const GAMES=[
    ['lobby','선수 입장'],['open','개회식'],['flag','청기백기'],['snow','신문지 눈싸움'],['volley','풍선 배구'],
    ['relay','바구니 릴레이'],['pak','박 터뜨리기'],['tug','줄다리기'],['race','달리기 경주'],['yut','윷놀이'],['award','시상식']];
  const TIPS={lobby:'곧 시작해요!',open:'모두 함께 두드려서\n풍선을 불어요!',flag:'화면 명령대로\n청기·백기를 눌러요',snow:'두드릴수록 눈덩이가\n상대편으로 날아가요!',
    volley:'풍선이 우리 쪽에 오면\n빨리 두드려서 넘겨요!',relay:'내 차례가 오면\n빨리 두드려요!',pak:'두드린 만큼\n박에 금이 가요!',tug:'빨리 두드려서\n밧줄을 당겨요!',race:'두드린 만큼\n내가 달려 나가요!',yut:'우리 팀 차례에\n두드려서 윷을 던져요!',award:''};
  $('#tabs').innerHTML=GAMES.map(([k,v])=>`<button data-g="${k}">${v}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.g));
  let frameFn=null,timers=[],forceEnd=false,running=false;
  const clearT=()=>{timers.forEach(clearTimeout);timers=[]};
  const lockTabs=on=>$('#tabs').querySelectorAll('button').forEach(b=>b.disabled=on);
  function go(key){
    if(running)return;closeScores();clearT();frameFn=null;lobbyDraw=null;try{speechSynthesis.cancel()}catch(e){}
    setH({game:key,phase:'ready',tip:TIPS[key]||'',cmd:null,turn:null,order:null,turnTeam:null,names:S.names});
    $('#tabs').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.g===key));
    ({lobby:gLobby,open:gOpen,flag:gFlag,snow:gSnow,volley:gVolley,relay:gRelay,pak:gPak,tug:gTug,race:gRace,yut:gYut,award:gAward})[key]();

  /* ===== 청기백기 (점점 빨라지고, 속임수 명령이 섞여요) ===== */
  function gFlag(){
    $('#stage').innerHTML=`<div class="call display" id="call">준비!</div><div class="answer" id="ans"></div><div class="sub" id="sub">명령대로 핸드폰의 청기·백기를 눌러요. "하지 마"는 누르면 안 돼요! 점점 빨라지고, 말이 끝까지 나와야 진짜 명령이에요!</div>
      <div class="flagres">${[0,1].map(k=>`<div class="fr ${k?'w':''}" style="${tstyle(k)}"><div class="display" style="font-size:clamp(24px,2.4vw,44px)">${esc(S.names[k])} <span style="font-size:.6em">1인 평균</span></div>
        <div class="n display" id="fs${k}">0.0점</div><div class="d" id="fd${k}">&nbsp;</div></div>`).join('')}</div>
      <div class="gauge" style="height:22px"><i id="fw"></i></div>${ctl()}`;
    const SIMPLE=[['청기 올려!','b'],['백기 올려!','w']];
    const TRICK=[['청기 올리지 마!','x'],['백기 올리지 마!','x'],['청기 말고 백기!','w'],['백기 말고 청기!','b']];
    const FAKE=[{t1:'청기 올리…',t2:'청기 올리… 지 마!',a:'x',e:'b'},{t1:'백기 올리…',t2:'백기 올리… 지 마!',a:'x',e:'w'},
      {t1:'청기…',t2:'청기… 말고 백기!',a:'w',e:'b'},{t1:'백기…',t2:'백기… 말고 청기!',a:'b',e:'w'}];
    let pts=[0,0],n=0,last='',wt=null;
    function pick(){
      if(n<=3)return{t1:SIMPLE[Math.random()<.5?0:1][0],a:null};
      const r=Math.random();
      if(n>=5&&r<.3){const f=FAKE[Math.floor(Math.random()*FAKE.length)];return{...f}}
      const c=r<.6?SIMPLE[Math.floor(Math.random()*2)]:TRICK[Math.floor(Math.random()*TRICK.length)];return{t1:c[0],a:c[1]};
    }
    function nextCmd(){
      if(n>=S.flagCount||forceEnd){finish();return}
      n++;let c,g=0;do{c=pick()}while((c.t2||c.t1)===last&&g++<10);last=c.t2||c.t1;
      if(!c.a)c.a=c.t1.startsWith('청')?'b':'w';
      const W=Math.max(1.3,2.6-n*.1)*1000+(((c.t2||c.t1).includes('말고'))?1200:0),delay=c.t2?750:0,id=H.round*100+n;
      FLAG={id,a:c.a,fake:c.t2?{e:c.e,at:performance.now()+delay}:null,start:performance.now()};
      $('#call').textContent=c.t1;$('#ans').textContent=`${n} / ${S.flagCount}`;say(c.t1,1.3);
      setH({phase:'go',cmd:{id,text:c.t1}});SFX.tick();
      if(c.t2)timers.push(setTimeout(()=>{$('#call').textContent=c.t2;say(c.t2.split('…')[1]||c.t2,1.4);setH({cmd:{id,text:c.t2}})},delay));
      const t0=performance.now();clearInterval(wt);wt=setInterval(()=>{const p=Math.max(0,1-(performance.now()-t0)/(W+delay));$('#fw').style.width=p*100+'%';if(p<=0)clearInterval(wt)},50);
      timers.push(wt);timers.push(setTimeout(reveal,W+delay));
    }
    function reveal(){
      const T=agg(),id=FLAG.id,a=FLAG.a;
      T.forEach((t,k)=>{let good=0,bad=0;for(const p of t.list){const v=p.ans&&p.ans.c===id?p.ans.v:null;
          if(a==='x'){if(v)bad++}else{if(v===a)good++;else if(v)bad++}}
        pts[k]+=good-bad;$('#fs'+k).textContent=(t.n?pts[k]/t.n:0).toFixed(1)+'점';$('#fd'+k).textContent=a==='x'?`참은 사람 ${t.n-bad}명 · 속은 사람 ${bad}명`:`맞힘 ${good}명 · 틀림 ${bad}명`});
      $('#ans').textContent=a==='x'?'정답: 누르지 않기!':`정답: ${a==='b'?'청기':'백기'}`;
      const anyBad=T.some(t=>t.list.some(p=>p.ans&&p.ans.c===id&&(a==='x'||p.ans.v!==a)));anyBad?SFX.buzz():SFX.ding();
      setH({phase:'reveal',cmd:{id,text:H.cmd?H.cmd.text:'',a}});
      timers.push(setTimeout(nextCmd,1300));
    }
    function finish(){
      clearInterval(wt);endRound();$('#go').disabled=false;$('#go').textContent='한 판 더';$('#fw').style.width='0';
      const T=agg(),avg=[0,1].map(k=>T[k].n?pts[k]/T[k].n:0);
      const k=avg[0]===avg[1]?null:(avg[0]>avg[1]?0:1);
      $('#call').textContent='끝!';$('#ans').textContent=`1인 평균 ${S.names[0]} ${avg[0].toFixed(1)}점 · ${S.names[1]} ${avg[1].toFixed(1)}점`;
      win(k,'flag','청기백기');
    }
    $('#stop').onclick=()=>{if(running&&H.phase!=='count'){clearT();finish()}};
    bindGo(()=>{pts=[0,0];n=0;[0,1].forEach(k=>{$('#fs'+k).textContent='0.0점';$('#fd'+k).innerHTML='&nbsp;'});startRound(()=>nextCmd())});
  }

  /* ===== 신문지 눈싸움 (우리 쪽 눈덩이만 던질 수 있어요) ===== */
  function gSnow(){
    const TOTAL=60;
    $('#stage').innerHTML=`<div class="call display mid" id="call">준비!</div><div class="sub" id="sub">우리 쪽에 떨어진 눈덩이를 빨리 두드려서 상대편으로 던져요! 끝났을 때 우리 쪽 눈덩이가 적은 팀이 이겨요</div>
      <div class="snow" id="snowf">${[0,1].map(k=>`<div class="half2 ${k?'w':'b'}"><div class="display" style="font-size:clamp(26px,2.6vw,48px)">${esc(S.names[k])} 쪽</div>
        <div class="n display" id="sn${k}">${TOTAL/2}</div><div class="dots" id="sd${k}"></div></div>`).join('')}</div>${ctl()}`;
    let on=false,t0=0,prev=[0,0],rate=[0,0],acc=[0,0],lastSec=null;const b=[TOTAL/2,TOTAL/2],shown=[-1,-1];
    const drawDots=()=>[0,1].forEach(k=>{const n=Math.round(b[k]);if(shown[k]!==n){shown[k]=n;$('#sn'+k).textContent=n;$('#sd'+k).innerHTML='<span></span>'.repeat(n)}});
    function fly(from){
      const f=$('#snowf').getBoundingClientRect(),y=f.top+f.height*(.35+Math.random()*.4),x0=f.left+f.width*(from?.6+Math.random()*.3:.1+Math.random()*.3),dx=(from?-1:1)*f.width*.5;
      const el=document.createElement('div');el.className='fly';el.style.left=x0+'px';el.style.top=y+'px';document.body.appendChild(el);
      el.animate([{transform:'translate(0,0)'},{transform:`translate(${dx/2}px,-160px)`},{transform:`translate(${dx}px,0)`}],{duration:700,easing:'ease-in-out'}).onfinish=()=>el.remove();
    }
    drawDots();
    bindGo(()=>{b[0]=b[1]=TOTAL/2;rate=[0,0];acc=[0,0];lastSec=null;drawDots();
      startRound(now=>{on=true;t0=now;const T=agg();prev=[T[0].sum,T[1].sum];$('#call').textContent='던져라!!'})});
    frameFn=(dt)=>{if(!on)return;const T=agg(),al=1-Math.exp(-dt/1.2);
      [0,1].forEach(k=>{const d=Math.max(0,T[k].sum-prev[k]);prev[k]=T[k].sum;rate[k]+=((T[k].n?d/dt/T[k].n:0)-rate[k])*al});
      const flow=[0,1].map(k=>1.15*rate[k]*Math.pow(b[k]/TOTAL,.35));
      b[0]=Math.max(0,Math.min(TOTAL,b[0]+(flow[1]-flow[0])*dt));b[1]=TOTAL-b[0];
      [0,1].forEach(k=>{acc[k]+=flow[k]*dt;let c=0;while(acc[k]>=1){acc[k]-=1;if(c++<3)fly(k)}});drawDots();
      const left=S.snowSec-(performance.now()-t0)/1000,sec=Math.ceil(left);
      $('#sub').textContent=left<=10?`마지막 ${Math.max(0,sec)}초!!`:`남은 시간 ${Math.max(0,sec)}초`;
      if(left<=10&&sec!==lastSec&&sec>0){lastSec=sec;SFX.beep()}
      if(left<=0||forceEnd){on=false;endRound();$('#go').disabled=false;$('#go').textContent='한 판 더';
        const n0=Math.round(b[0]),n1=Math.round(b[1]),k=n0===n1?null:(n0<n1?0:1);
        $('#call').textContent=k==null?'무승부!':`${S.names[k]} 쪽이 더 깨끗해요!`;win(k,'snow','신문지 눈싸움')}};
  }

  /* ===== 풍선 배구 ===== */
  function gVolley(){
    $('#stage').innerHTML=`<div class="vs display"><span style="color:#9CC0FF">${esc(S.names[0])}</span><span id="v0">0</span><span>:</span><span id="v1">0</span><span>${esc(S.names[1])}</span></div>
      <div class="sub" id="call">${S.volleyPts}점 먼저 내면 이겨요. 풍선이 우리 쪽에 떨어지기 전에 노란 막대를 채우면 넘어가요!</div><canvas id="vc"></canvas>${ctl()}`;
    const c=$('#vc'),g=c.getContext('2d');let W=0,Hh=0;
    const fit=()=>{const r=c.getBoundingClientRect();W=r.width*devicePixelRatio;Hh=r.height*devicePixelRatio;c.width=W;c.height=Hh};fit();
    const NEED=S.volleyNeed,FLOOR=.9,NET_TOP=.55;
    const b={x:.25,y:.12,side:0,speed:.2,fly:null};let on=false,sc=[0,0],baseAvg=[0,0],energy=0,pause=0;
    function serve(k){b.side=k;b.x=k?.72:.28;b.y=.12;b.speed=.15;b.fly=null;pause=1.3;const T=agg();baseAvg=[T[0].avg,T[1].avg];energy=0}
    function draw(){
      if(!W)fit();g.clearRect(0,0,W,Hh);
      g.fillStyle='rgba(30,86,196,.45)';g.fillRect(0,0,W/2,Hh);g.fillStyle='rgba(255,255,255,.22)';g.fillRect(W/2,0,W/2,Hh);
      g.fillStyle='#C99A5B';g.fillRect(0,FLOOR*Hh,W,Hh-FLOOR*Hh);
      g.strokeStyle='#fff';g.lineWidth=8;g.beginPath();g.moveTo(W/2,NET_TOP*Hh);g.lineTo(W/2,FLOOR*Hh);g.stroke();
      g.lineWidth=2;for(let y=NET_TOP;y<FLOOR;y+=.04){g.beginPath();g.moveTo(W/2-12,y*Hh);g.lineTo(W/2+12,y*Hh);g.stroke()}
      if(on&&!b.fly){const x0=b.side?W/2+20:20,w=W/2-40;g.fillStyle='rgba(0,0,0,.25)';g.fillRect(x0,Hh*.03,w,22);g.fillStyle='#F4B400';g.fillRect(x0,Hh*.03,w*Math.min(1,energy/NEED),22)}
      const x=b.x*W,y=b.y*Hh,r=.055*Hh;
      g.strokeStyle='rgba(255,255,255,.8)';g.lineWidth=3;g.beginPath();g.moveTo(x,y+r);g.quadraticCurveTo(x+10,y+r*1.8,x,y+r*2.6);g.stroke();
      g.fillStyle='#D62839';g.beginPath();g.ellipse(x,y,r*.88,r,0,0,Math.PI*2);g.fill();
      g.fillStyle='rgba(255,255,255,.45)';g.beginPath();g.ellipse(x-r*.3,y-r*.35,r*.2,r*.3,-.5,0,Math.PI*2);g.fill();
    }
    function over(k){on=false;endRound();$('#go').disabled=false;$('#go').textContent='한 판 더';$('#call').textContent=k==null?'무승부!':`${S.names[k]} 승리!`;win(k,'volley','풍선 배구')}
    bindGo(()=>{sc=[0,0];$('#v0').textContent=0;$('#v1').textContent=0;serve(Math.random()<.5?0:1);startRound(()=>{on=true;serve(b.side);$('#call').textContent='넘겨라!!'})});
    frameFn=(dt)=>{
      if(on){
        const T=agg();
        if(b.fly){
          b.fly.t+=dt/.9;const t=Math.min(1,b.fly.t);b.x=b.fly.x0+(b.fly.x1-b.fly.x0)*t;b.y=b.fly.y0+(.1-b.fly.y0)*Math.sin(Math.PI*t)*1+(b.fly.y1-b.fly.y0)*t*t;
          if(t>=1){b.fly=null;b.side=1-b.side;baseAvg[b.side]=T[b.side].avg;energy=0}
        }else if(pause>0){pause-=dt;baseAvg[b.side]=T[b.side].avg}
        else{
          energy=T[b.side].avg-baseAvg[b.side];b.y+=b.speed*dt;b.x+=Math.sin(performance.now()/500)*.0006;
          if(energy>=NEED){SFX.thump();b.speed=Math.min(.6,b.speed*1.08);
            const x1=b.side?.15+Math.random()*.25:.6+Math.random()*.25;b.fly={t:0,x0:b.x,y0:b.y,x1,y1:.12}}
          else if(b.y>=FLOOR-.05){const k=1-b.side;sc[k]++;$('#v'+k).textContent=sc[k];SFX.buzz();
            if(sc[k]>=S.volleyPts)over(k);else{shout(`${S.names[k]} 1점!`,k);serve(b.side)}}
        }
        if(forceEnd&&on)over(sc[0]===sc[1]?null:(sc[0]>sc[1]?0:1));
      }
      draw();
    };
    addEventListener('resize',fit);
  }

  /* ===== 바구니 릴레이 ===== */
  function gRelay(){
    $('#stage').innerHTML=`<div class="call display mid" id="call">준비!</div><div class="sub">한 사람이 ${S.relayLeg}번 두드리면 바구니가 다음 선수에게 넘어가요. 먼저 끝나는 팀이 이겨요!</div><div class="sub" id="rnote" style="color:var(--yellow)"></div>
      ${[0,1].map(k=>`<div class="rlane"><h3 class="display"><span>${esc(S.names[k])}</span><span class="now" id="rn${k}"></span>
        <button class="btn small" id="skip${k}">다음 선수로 넘기기</button></h3><div class="chips" id="rc${k}"></div><div class="gauge" style="width:100%"><i id="rg${k}"></i></div></div>`).join('')}${ctl()}`;
    let on=false,order=[[],[]],idx=[0,0],base={},finished=[],orig=[0,0];
    function drawR(T){[0,1].forEach(k=>{
      $('#rc'+k).innerHTML=order[k].map((pid,i)=>{const p=players[pid]||{};return `<span class="chip ${k?'w':''} ${i===idx[k]?'cur':''} ${i<idx[k]?'done':''}" style="${tstyle(k)}">${i===idx[k]?'🧺 ':''}${esc(S.names[k].slice(0,1))}${p.num||'?'}${i>=orig[k]&&orig[k]?' ↻':''}</span>`}).join('');
      const pid=order[k][idx[k]];const p=T&&T[k].list.find(x=>x.pid===pid);const d=p?p.taps-(base[pid]||0):0;
      $('#rg'+k).style.width=pid?Math.min(100,d/S.relayLeg*100)+'%':'100%';
      $('#rn'+k).textContent=pid?`지금: ${S.names[k].slice(0,1)}${(players[pid]||{}).num} 선수 (${idx[k]+1}/${order[k].length})`:(finished.includes(k)?`🏁 ${finished.indexOf(k)+1}등으로 도착!`:'')})}
    function pass(k,T){
      const pid=order[k][idx[k]];idx[k]++;SFX.ding();
      const next=order[k][idx[k]];
      if(next){const p=T[k].list.find(x=>x.pid===next);base[next]=p?p.taps:0}
      else{finished.push(k);if(finished.length===1){shout(`${S.names[k]}\n1등 도착!`,k);SFX.fanfare()}}
      setH({turn:{0:order[0][idx[0]]||null,1:order[1][idx[1]]||null}});
    }
    [0,1].forEach(k=>$('#skip'+k).onclick=()=>{if(on&&order[k][idx[k]])pass(k,agg())});
    bindGo(()=>{
      const L=onlineList();order=[0,1].map(k=>L.filter(p=>p.team===k).map(p=>p.pid));idx=[0,0];base={};finished=[];
      orig=[order[0].length,order[1].length];const len=Math.max(orig[0],orig[1]);
      [0,1].forEach(k=>{const o=order[k].slice();let i=0;while(o.length&&order[k].length<len)order[k].push(o[i++%o.length])});
      $('#rnote').textContent=orig[0]!==orig[1]?`${S.names[orig[0]<orig[1]?0:1]}은 인원이 적어서 앞 선수 ${Math.abs(orig[0]-orig[1])}명이 한 번 더 뛰어요 (↻ 표시)`:'';
      startRound(()=>{on=true;$('#call').textContent='출발!!';setH({phase:'go',order:{0:order[0],1:order[1]},turn:{0:order[0][0]||null,1:order[1][0]||null}})});
      drawR(null);
    });
    drawR(null);
    frameFn=()=>{if(!on)return;const T=agg();
      [0,1].forEach(k=>{const pid=order[k][idx[k]];if(!pid)return;const p=T[k].list.find(x=>x.pid===pid);if(p&&p.taps-(base[pid]||0)>=S.relayLeg)pass(k,T)});
      drawR(T);
      if(finished.length===2||(finished.length===1&&forceEnd)||forceEnd){on=false;endRound();$('#go').disabled=false;$('#go').textContent='한 판 더';
        const k=finished.length?finished[0]:(idx[0]===idx[1]?null:(idx[0]/Math.max(1,order[0].length)>idx[1]/Math.max(1,order[1].length)?0:1));
        $('#call').textContent=k==null?'무승부!':`${S.names[k]} 승리!`;win(k,'relay','바구니 릴레이')}};
  }

  function gPak(){
    $('#stage').innerHTML=`<div class="call display mid" id="call">준비!</div><div class="sub" id="sub">우리 팀이 두드린 만큼 박에 금이 가요. 먼저 터뜨리는 팀이 이겨요!</div>
      <div class="paks">${[0,1].map(k=>`<div class="pakcol"><div class="display" style="font-size:clamp(26px,2.6vw,48px)">${esc(S.names[k])}</div>
        <div class="pak" id="pk${k}" style="${tstyle(k)}"><div class="half l"></div><div class="half r"></div><div class="banner" style="${tstyle(k)}">${esc(S.names[k])}<br>만세!</div></div>
        <div class="gauge sm"><i id="pg${k}"></i></div><div class="sub" id="pp${k}">0%</div></div>`).join('')}</div>${ctl()}`;
    let on=false,t0=0;
    bindGo(()=>{[0,1].forEach(k=>{$('#pk'+k).className='pak';$('#pg'+k).style.width='0';$('#pp'+k).textContent='0%'});
      startRound(now=>{on=true;t0=now;$('#call').textContent='두드려라!!';[0,1].forEach(k=>$('#pk'+k).classList.add('shake'))})});
    frameFn=()=>{if(!on)return;const T=agg(),pct=[0,1].map(k=>T[k].n?Math.min(100,T[k].sum/(T[k].n*S.pakPer)*100):0);
      [0,1].forEach(k=>{$('#pg'+k).style.width=pct[k]+'%';$('#pp'+k).textContent=Math.floor(pct[k])+'%'});
      const t=(performance.now()-t0)/1000;$('#sub').textContent=`${Math.floor(t)}초`;const done=[0,1].filter(k=>pct[k]>=100);
      if(done.length||t>=60||forceEnd){on=false;endRound();$('#go').disabled=false;$('#go').textContent='한 판 더';
        const k=done.length===1?done[0]:(pct[0]===pct[1]?null:(pct[0]>pct[1]?0:1));[0,1].forEach(j=>$('#pk'+j).classList.remove('shake'));
        if(k!=null){$('#pk'+k).classList.add('burst');SFX.pop()}$('#call').textContent=k==null?'무승부!':`${S.names[k]} 박이 터졌어요!`;
        timers.push(setTimeout(()=>win(k,'pak','박 터뜨리기'),600))}};
  }

  /* ===== 줄다리기 (3판 2선승, 밀고 당기기) ===== */
  function gTug(){
    $('#stage').innerHTML=`<div class="call display" id="call">준비!</div><div class="sub" id="sub">3판 2선승! 더 빨리 두드리는 팀 쪽으로 밧줄이 끌려가요. 지고 있는 팀은 힘이 더 세져요!</div>
      <div class="rounds display" id="rw"></div>
      <div class="tug"><div class="side l display">${esc(S.names[0])}</div><div class="side r display">${esc(S.names[1])}</div><div class="rope"></div><div class="midl"></div>
      <div class="goal" style="left:22%"></div><div class="goal" style="left:78%"></div><div class="ribbon" id="rib" style="left:50%"></div></div>
      <div class="tavg"><span id="a0"></span><span id="a1"></span></div>${ctl()}`;
    let on=false,t0=0,pos=0,prev=[0,0],rate=[0,0],wins=[0,0],rnd=0,lastSec=null;
    const drawWins=()=>{$('#rw').innerHTML=[0,1].map(k=>`<span style="color:${k?'#fff':'#9CC0FF'}">${esc(S.names[k])} ${'●'.repeat(wins[k])}${'○'.repeat(2-wins[k])}</span>`).join('<span style="opacity:.6"> · </span>')};
    drawWins();
    function roundOver(k){
      on=false;endRound();$('#go').disabled=false;
      if(k!=null)wins[k]++;drawWins();
      const champ=wins[0]>=2?0:wins[1]>=2?1:null;
      if(champ!=null){$('#call').textContent=`${S.names[champ]} 승리!`;$('#go').textContent='새 경기';win(champ,'tug','줄다리기');wins=[0,0];rnd=0;return}
      $('#call').textContent=k==null?`${rnd}판 무승부!`:`${rnd}판: ${S.names[k]} 승!`;$('#go').textContent=`${rnd+1}판 시작`;
      if(k!=null){SFX.whistle(.7);shout(`${S.names[k]}\n${rnd}판 승!`,k)}else SFX.whistle(.7);
    }
    bindGo(()=>{if(rnd===0){wins=[0,0];drawWins()}rnd++;pos=0;rate=[0,0];lastSec=null;$('#rib').style.left='50%';
      startRound(now=>{on=true;t0=now;const T=agg();prev=[T[0].sum,T[1].sum];$('#call').textContent=`${rnd}판! 당겨라!!`})});
    frameFn=(dt,now)=>{if(!on)return;const T=agg(),al=1-Math.exp(-dt/.7);
      [0,1].forEach(k=>{const d=Math.max(0,T[k].sum-prev[k]);prev[k]=T[k].sum;rate[k]+=((T[k].n?d/dt/T[k].n:0)-rate[k])*al});
      const left=S.tugSec-(performance.now()-t0)/1000,sec=Math.ceil(left),tot=rate[0]+rate[1];
      let rel=tot>.5?(rate[1]-rate[0])/tot:0;
      rel-=pos/100*.05;
      const target=Math.max(-115,Math.min(115,rel*(left<=5?1300:900)));
      pos+=(target-pos)*Math.min(1,dt*.9)+Math.sin(now/260)*.25;
      pos=Math.max(-100,Math.min(100,pos));$('#rib').style.left=(50+pos*.28)+'%';
      $('#a0').textContent=`1초에 ${rate[0].toFixed(1)}번`;$('#a1').textContent=`1초에 ${rate[1].toFixed(1)}번`;
      $('#sub').textContent=left<=5?`막판 힘내요!! ${Math.max(0,sec)}초`:`${rnd}판 · 남은 시간 ${Math.max(0,sec)}초`;
      if(left<=5&&sec!==lastSec&&sec>0){lastSec=sec;SFX.beep()}
      if(Math.abs(pos)>=99.5)roundOver(pos<0?0:1);
      else if(left<=0||forceEnd)roundOver(Math.abs(pos)<1?null:(pos<0?0:1));
    };
  }

  /* ===== 달리기 경주 ===== */
  function gRace(){
    $('#stage').innerHTML=`<div class="call display mid" id="call">준비!</div><div class="sub" id="sub">${S.raceGoal}번 먼저 두드리면 결승선! 1인 평균 등수가 좋은 팀이 이겨요</div>
      <div class="lanes" id="lanes"></div>${ctl('출발!')}`;
    let on=false,t0=0,order=[],runners=[];
    function build(){runners=onlineList();$('#lanes').innerHTML=runners.map(p=>`<div class="rl"><span class="tn">${esc(S.names[p.team].slice(0,1))}${p.num}</span>
      <div class="track"><i id="ti${p.pid}" style="background:${TEAM[p.team].bg}"></i><b id="tb${p.pid}" style="left:0">🏃</b></div><span class="cn" id="tc${p.pid}">0</span></div>`).join('')}
    build();
    bindGo(()=>{build();order=[];startRound(now=>{on=true;t0=now;$('#call').textContent='달려라!!'})});
    frameFn=()=>{
      if(!on){if(!running&&H.phase==='ready'&&onlineList().length!==runners.length)build();return}
      const T=agg(),all=[...T[0].list,...T[1].list];
      for(const p of all){const q=Math.min(100,p.taps/S.raceGoal*100),i=$('#ti'+p.pid);if(!i)continue;i.style.width=q+'%';$('#tb'+p.pid).style.left=q+'%';
        if(p.taps>=S.raceGoal&&!order.includes(p.pid)){order.push(p.pid);SFX.beep(true);if(order.length===1){shout(`${S.names[p.team].slice(0,1)}${p.num} 선수\n1등!`,p.team);confetti([TEAM[p.team].bg,'#F4B400'])}}
        const r=order.indexOf(p.pid);$('#tc'+p.pid).textContent=r>=0?`${r+1}등`:p.taps}
      const t=(performance.now()-t0)/1000;$('#sub').textContent=`${Math.floor(t)}초`;
      if((all.length&&order.length>=all.length)||t>=90||forceEnd){
        on=false;endRound();$('#go').disabled=false;$('#go').textContent='다시 달리기';
        const rest=all.filter(p=>!order.includes(p.pid)).sort((a,b)=>b.taps-a.taps).map(p=>p.pid),rank=[...order,...rest];
        const avg=[0,1].map(k=>{const r=rank.map((pid,i)=>({pid,i})).filter(o=>(players[o.pid]||{}).team===k);return r.length?r.reduce((s,o)=>s+o.i+1,0)/r.length:999});
        const k=avg[0]===avg[1]?null:(avg[0]<avg[1]?0:1);
        $('#call').textContent=`평균 등수 ${S.names[0]} ${avg[0].toFixed(1)}등 · ${S.names[1]} ${avg[1].toFixed(1)}등`;
        win(k,'race','달리기 경주');
      }
    };
  }

  /* ===== 윷놀이 ===== */
  function gYut(){
    const N=20,NEED=S.yutNeed,RES=[['빽도',-1,.06],['도',1,.2],['개',2,.32],['걸',3,.24],['윷',4,.1],['모',5,.08]];
    const pt=i=>i<=5?[88,88-15.2*i]:i<=10?[88-15.2*(i-5),12]:i<=15?[12,12+15.2*(i-10)]:[12+15.2*(i-15),88];
    $('#stage').innerHTML=`<div class="yut">
      <div class="yboard"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M12 12 L88 88 M88 12 L12 88" stroke="rgba(255,255,255,.35)" stroke-width=".8" fill="none"/>
        <rect x="12" y="12" width="76" height="76" fill="none" stroke="rgba(255,255,255,.6)" stroke-width=".8"/></svg>
        ${Array.from({length:N},(_,i)=>{const [x,y]=pt(i);return `<span class="st ${i%5===0?'big':''}" style="left:${x}%;top:${y}%">${i===0?'출발':''}</span>`}).join('')}
        <span class="tok" id="tk0" style="${tstyle(0)}">${esc(S.names[0].slice(0,1))}</span><span class="tok w" id="tk1" style="${tstyle(1)}">${esc(S.names[1].slice(0,1))}</span></div>
      <div><div class="call display mid" id="call">윷놀이</div><div class="sub" id="sub">우리 팀 차례에 모두 두드리면 윷이 던져져요. 한 바퀴 먼저 돌아오면 이겨요!<br>윷·모가 나오거나 상대 말을 잡으면 한 번 더!</div>
        <div class="sticks" id="sticks">${'<i></i>'.repeat(4)}</div><div class="ybig display" id="yres"></div>
        <div class="gauge" style="width:100%"><i id="yg"></i></div>
        <div class="row"><button class="btn go big" id="go">시작</button><button class="btn small" id="throw" disabled>직접 던지기</button><button class="btn small" id="stop">여기서 끝내기</button></div></div></div>`;
    let pos=[0,0],turn=0,on=false,busy=false;const base=[0,0];
    function place(){[0,1].forEach(k=>{const p=pos[k]>=N?0:pos[k],[x,y]=pt(p),same=pos[0]===pos[1];const el=$('#tk'+k);
      el.style.left=`calc(${x}% + ${same?(k?16:-16):0}px)`;el.style.top=y+'%';el.classList.toggle('home',pos[k]>=N)})}
    function showSticks(name){const el=$('#sticks').children,n={빽도:1,도:1,개:2,걸:3,윷:4,모:0}[name];
      let idx=[0,1,2,3].sort(()=>Math.random()-.5).slice(0,n);if(name==='빽도')idx=[3];else if(name==='도')idx=[Math.floor(Math.random()*3)];
      for(let i=0;i<4;i++)el[i].className=(idx.includes(i)?'f':'')+(i===3?' x':'')}
    function roll(){const r=Math.random();let a=0;for(const x of RES){a+=x[2];if(r<a)return x}return RES[2]}
    function setTurn(k,again){turn=k;busy=false;base[k]=agg()[k].avg;
      $('#call').textContent=`${S.names[k]} 차례${again?' (한 번 더!)':''}`;$('#call').style.color=k?'#fff':'#9CC0FF';$('#yg').style.width='0';$('#throw').disabled=false;
      setH({phase:'go',turnTeam:k})}
    function doThrow(){
      if(!on||busy)return;busy=true;$('#throw').disabled=true;setH({phase:'wait'});$('#yg').style.width='100%';
      let n=0;const spin=setInterval(()=>{showSticks(['도','개','걸','윷','모'][n%5]);SFX.tick();n++},90);timers.push(spin);
      timers.push(setTimeout(()=>{clearInterval(spin);const [name,step]=roll();showSticks(name);$('#yres').textContent=name+'!';say(name);
        if(step>=4){SFX.fanfare();confetti([TEAM[turn].bg,'#F4B400'])}else SFX.ding();move(step)},1100));
    }
    function move(step){
      const k=turn,dir=step<0?-1:1;let left=Math.abs(step);
      const one=()=>{
        if(left<=0||(dir<0&&pos[k]===0)||pos[k]>=N){afterMove(step);return}
        pos[k]+=dir;left--;SFX.thump();place();timers.push(setTimeout(one,380));
      };
      timers.push(setTimeout(one,700));
    }
    function afterMove(step){
      const k=turn,o=1-k;
      if(pos[k]>=N){on=false;endRound();$('#go').disabled=false;$('#go').textContent='한 판 더';$('#throw').disabled=true;$('#call').textContent=`${S.names[k]} 도착!`;win(k,'yut','윷놀이');return}
      let again=step>=4;
      if(pos[k]>0&&pos[k]===pos[o]){pos[o]=0;place();again=true;SFX.pop();shout(`${S.names[k]}\n잡았다!`,k)}
      timers.push(setTimeout(()=>{$('#yres').textContent='';setTurn(again?k:o,again)},again?1800:1300));
    }
    place();
    $('#throw').onclick=doThrow;
    $('#stop').onclick=()=>{if(on)forceEnd=true};
    bindGo(()=>{pos=[0,0];place();$('#yres').textContent='';startRound(()=>{on=true;setTurn(Math.random()<.5?0:1,false)})});
    frameFn=()=>{
      if(!on)return;
      if(forceEnd){on=false;clearT();endRound();$('#go').disabled=false;$('#go').textContent='한 판 더';$('#throw').disabled=true;
        const k=pos[0]===pos[1]?null:(pos[0]>pos[1]?0:1);$('#call').textContent=k==null?'무승부!':`${S.names[k]} 승리!`;win(k,'yut','윷놀이');return}
      if(busy)return;const e=agg()[turn].avg-base[turn];$('#yg').style.width=Math.min(100,e/NEED*100)+'%';if(e>=NEED)doThrow();
    };
  }

    $('#sv').onclick=()=>{
      const pu=$('#fpu').value.trim();
      if(pu&&!/^https:\/\/\S+$/.test(pu)){$('#cfgMsg').innerHTML='<span class="bad">주소는 https:// 로 시작해야 해요. GitHub Pages 주소를 그대로 복사해 넣어 주세요.</span>';return}
      const wasPractice=S.practice;
      S.phoneUrl=pu;S.practice=$('#fpr').checked;
      S.names=[$('#n0').value.trim()||'청팀',$('#n1').value.trim()||'백팀'];S.win=v('wn',100,0,10000);S.flagCount=v('fl',15,3,40);S.snowSec=v('ss',60,10,300);
      S.volleyPts=v('vp',5,1,15);S.relayLeg=v('rl',30,3,300);S.pakPer=v('pp',150,5,2000);S.tugSec=v('ts',25,10,120);S.raceGoal=v('rg',200,10,2000);S.openPer=v('op',80,5,1000);S.volleyNeed=v('vn',12,3,100);S.yutNeed=v('yn',15,3,200);
      save();closeModal();
      if(wasPractice!==S.practice){location.reload();return}
      H.names=S.names;renderBoard();netWarn();badge();go(H.game);
    };
    $('#cn').onclick=closeModal;
  }
  $('#setBtn').onclick=settings;
  const musLabel=()=>{$('#musBtn').textContent=`🎵 음악 ${MUSIC.cfg.on?'켜짐':'꺼짐'}`};musLabel();
  $('#musBtn').onclick=()=>{ac();MUSIC.toggle(!MUSIC.cfg.on);musLabel()};
  MUSIC.loadCustom().then(()=>MUSIC.refresh());

  addEventListener('keydown',e=>{const tag=e.target.tagName||'';if(tag==='INPUT'||tag==='TEXTAREA'||$('#modal').classList.contains('open'))return;
    if($('#scoreov').classList.contains('show')&&['PageDown','ArrowRight',' ','Enter','Escape'].includes(e.key)){e.preventDefault();closeScores();return}
    if(['PageDown','ArrowRight',' ','Enter'].includes(e.key)){e.preventDefault();ac();const g=$('#go');if(g&&!g.disabled)g.click();return}
    if(e.key==='m'||e.key==='M'||e.key==='ㅡ'){ac();MUSIC.toggle(!MUSIC.cfg.on);musLabel()}});
  document.addEventListener('click',e=>{ac();const b=e.target.closest('button');if(b)setTimeout(()=>b.blur(),0)});

  let last=performance.now();
  function loop(now){const dt=Math.min(.1,(now-last)/1000);last=now;botStep(dt);if(frameFn)frameFn(dt,now);requestAnimationFrame(loop)}
  requestAnimationFrame(loop);
  setInterval(()=>{badge();if(lobbyDraw&&S.practice)lobbyDraw()},1000);

  renderBoard();netWarn();badge();go('lobby');
}

/* ---------- 시작 ---------- */
if(IS_TV){document.title='손가락 운동회 (TV)';tvMain()}else phoneMain();
</script>
</body>
</html>
